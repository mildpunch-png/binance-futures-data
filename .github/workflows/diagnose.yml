name: Diagnose Binance Futures Endpoints

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test official endpoints
        run: python3 diagnose_endpoints.py
      - name: Save diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/endpoint_diagnostics.json
          git commit -m "Record Binance endpoint diagnostics" || exit 0
          git push
